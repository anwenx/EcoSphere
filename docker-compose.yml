# Written but NOT yet executed/verified. Run `docker compose config` first.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ecosphere
      POSTGRES_PASSWORD: ecosphere_dev   # local development only
      POSTGRES_DB: ecosphere
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgis-init.sql:/docker-entrypoint-initdb.d/00-postgis.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosphere -d ecosphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  optimizer:
    build: ./services/optimizer
    environment:
      OPTIMIZER_SERVICE_TOKEN: ${OPTIMIZER_SERVICE_TOKEN:?set OPTIMIZER_SERVICE_TOKEN in .env}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecosphere:ecosphere_dev@db:5432/ecosphere
      OPTIMIZER_BASE_URL: http://optimizer:8000
    depends_on:
      db: { condition: service_healthy }
      optimizer: { condition: service_healthy }
    ports: ["4000:4000"]

volumes:
  pgdata:
